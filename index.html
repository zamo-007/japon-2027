<meta charset="utf-8">

<script>try{var t=localStorage.getItem("japon-theme");if(t!=="dark"&&t!=="light")t="sakura";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","sakura")}</script>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one immersive photo band per section, calm ink panels below; bottom tab bar on phone, top tabs on desktop. Deliberately dark: night photos of Japan. */
:root{
  --ink:#0E1220; --ink-2:#151a2c; --ink-3:#1d2339; --line:rgba(236,229,214,.11);
  --paper:#ECE5D6; --mute:#a59f93; --lantern:#E9A93F; --lantern-ink:#2a1c05;
  --sakura:#E58AA8; --good:#7FC8A0; --bad:#E8806F; --seg1:#8FB3E8; --seg2:#7FC8A0; --seg3:#E9A93F;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}
:focus-visible{outline:2px solid var(--lantern);outline-offset:2px;border-radius:6px}

/* ---------- Login ---------- */
#gate,#login{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;overflow:auto;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 15%,transparent) 0%,color-mix(in srgb,var(--ink) 55%,transparent) 45%,var(--ink) 100%),url("img/chureito.jpg") center 35%/cover no-repeat var(--ink)}
.login-card{width:min(560px,100%);padding:32px 20px calc(36px + env(safe-area-inset-bottom,0px));display:grid;gap:22px}
.login-card .eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--lantern)}
.login-card h1{font-size:clamp(40px,9vw,64px);line-height:1.02;font-weight:800}
.login-card h1 span{display:block;font-size:.42em;color:var(--mute);font-weight:500;margin-top:8px;letter-spacing:.04em}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.who button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--ink-2) 72%,transparent);backdrop-filter:blur(8px);cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.who button:hover{border-color:var(--lantern);transform:translateY(-1px)}
.add-me{display:flex;gap:8px;flex-wrap:wrap}
.who-new{display:block;font-size:11px;color:var(--lantern);margin-top:2px}
.pinwho{display:flex;align-items:center;gap:12px}.pinwho b{display:block;font-size:20px}.pinwho small{display:block;font-size:13px;margin-top:2px}
.pinform{display:grid;gap:12px}
.pinf input{font-size:28px;letter-spacing:.5em;text-align:center;padding:12px 10px;font-variant-numeric:tabular-nums}
.adm{display:grid;gap:8px}.adm-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.adm-row .nm{flex:1 1 140px;min-width:0;display:flex;align-items:center;gap:8px}.adm-row .nm small{display:block}
.add-me input{flex:1 1 180px;min-width:0}

/* ---------- Shell ---------- */
.topbar{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ink) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;white-space:nowrap;background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left}
.brand small{font-family:var(--body);font-weight:400;color:var(--mute);font-size:12px;margin-left:6px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:none;padding:8px 12px;border-radius:10px;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab .k{font-family:var(--display);font-size:13px;opacity:.8}
.tab[aria-selected="true"]{color:var(--paper);background:var(--ink-3)}
.tab[aria-selected="true"] .k{color:var(--lantern);opacity:1}
.mebtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:none;border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;white-space:nowrap}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:color-mix(in srgb,var(--ink) 95%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .tab{flex-direction:column;gap:0;font-size:12px;padding:6px 8px}
  .tab .k{font-size:16px}
  .mebtn{margin-left:auto}
  main{padding-bottom:84px}
}

.hero{position:relative;height:clamp(190px,30vw,300px);overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 5%,transparent) 20%,color-mix(in srgb,var(--ink) 60%,transparent) 70%,var(--ink) 100%)}
.hero-in{position:absolute;left:0;right:0;bottom:0;z-index:1;max-width:1080px;margin:0 auto;padding:0 16px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero h2{font-size:clamp(30px,5.4vw,46px);line-height:1.05}
.hero h2 .k{display:block;font-size:14px;letter-spacing:.3em;color:var(--lantern);margin-bottom:6px;font-weight:500}
.hero p{margin:6px 0 0;color:var(--paper);opacity:.85;max-width:52ch}

.wrap{max-width:1080px;margin:0 auto;padding:8px 16px 48px;display:grid;gap:22px}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-size:19px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel h3 small{font-family:var(--body);font-size:13px;color:var(--mute);font-weight:400}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* Controls */
.btn{border:1px solid var(--line);background:var(--ink-3);padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--paper) 30%,transparent)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--lantern);color:var(--lantern-ink);border-color:var(--lantern);font-weight:700}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.icon-btn{border:0;background:none;color:var(--mute);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:16px;line-height:1}
.icon-btn:hover{color:var(--bad)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--lantern);outline:none}
label.f{display:grid;gap:5px;font-size:13px;color:var(--mute)}
.form{display:grid;gap:12px;padding:14px;border:1px dashed rgba(233,169,63,.4);border-radius:12px;background:rgba(233,169,63,.04)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row > *{flex:1 1 140px;min-width:0}
.row > .btn{flex:0 0 auto}

.avatar{--c:var(--lantern);width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c);color:#14110b;font-weight:700;font-size:13px;flex:0 0 auto}
.avatar.lg{width:38px;height:38px;font-size:15px}
.avatar.xs{width:22px;height:22px;font-size:11px;border:2px solid var(--ink-2)}
.stack{display:inline-flex}
.stack .avatar.xs+.avatar.xs{margin-left:-6px}

/* Progress */
.ring{--p:0;width:120px;height:120px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--lantern) calc(var(--p)*1%),color-mix(in srgb,var(--paper) 10%,transparent) 0)}
.ring>div{width:96px;height:96px;border-radius:50%;background:var(--ink-2);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-family:var(--display);font-size:30px}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--paper) 10%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lantern);border-radius:99px;transition:width .4s}
.people{display:grid;gap:12px}
.person{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.person .bar{grid-column:2/3}

/* Checklist */
.cat{margin-top:6px}
.cat-title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
.cat:first-child .cat-title{margin-top:0}
.check{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.check input{appearance:none;width:22px;height:22px;border-radius:7px;border:1.5px solid color-mix(in srgb,var(--paper) 35%,transparent);display:grid;place-items:center;cursor:pointer;margin:0}
.check input:checked{background:var(--lantern);border-color:var(--lantern)}
.check input:checked::after{content:"";width:10px;height:6px;border:2px solid var(--lantern-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check.done .t{color:var(--mute);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--paper) 30%,transparent)}
.check .t{overflow-wrap:anywhere}

/* Stages */
.stages{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.stage{flex:0 0 150px;position:relative;height:96px;border-radius:12px;overflow:hidden;border:2px solid transparent;cursor:pointer;padding:0;background:var(--ink-3);text-align:left}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75;transition:opacity .2s}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,color-mix(in srgb,var(--ink) 85%,transparent))}
.stage span{position:absolute;left:10px;bottom:8px;right:8px;z-index:1;line-height:1.2}
.stage b{font-family:var(--display);font-size:16px;display:block}
.stage small{color:var(--mute);font-size:12px}
.stage[aria-pressed="true"]{border-color:var(--lantern)}
.stage[aria-pressed="true"] img{opacity:1}
.acts{display:grid;gap:10px}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--ink)}
.act h4{margin:0;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.act .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.act .side{display:grid;justify-items:end;gap:8px;align-content:start}
.price{font-family:var(--display);font-size:18px;white-space:nowrap}
.join{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.join[aria-pressed="true"]{background:var(--sakura);border-color:var(--sakura);color:#2b0f19;font-weight:700}
.pill{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--good);border-color:rgba(127,200,160,.4)}
.ideas{display:flex;gap:8px;flex-wrap:wrap}
.idea{border:1px dashed color-mix(in srgb,var(--paper) 25%,transparent);background:none;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--mute)}
.idea:hover{color:var(--paper);border-color:var(--lantern)}
.empty{padding:22px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}

/* Budget & expenses */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:600px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{padding:14px 16px;border-radius:12px;background:var(--ink);border:1px solid var(--line)}
.kpi small{display:block;color:var(--mute);font-size:12px;letter-spacing:.06em}
.kpi b{font-family:var(--display);font-size:26px;display:block;margin-top:2px}
.kpi span{font-size:12px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--mute);font-size:12px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.line-input{width:110px!important;text-align:right;padding:6px 8px!important}
.bal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bal:first-child{border-top:0}
.pos{color:var(--good)} .neg{color:var(--bad)}
.settle{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--ink);border:1px solid var(--line);flex-wrap:wrap}
.settle .arrow{color:var(--lantern)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.sharepick{gap:12px!important}
.sp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sp-quick{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;gap:3px;background:var(--ink-3)}
.sp-quick button{border:0;background:none;color:var(--paper);font:inherit;font-size:13px;padding:7px 14px;border-radius:99px;cursor:pointer;min-height:34px}
.sp-quick button:hover{background:color-mix(in srgb,var(--lantern) 16%,transparent)}
.sp-quick button:active{background:var(--lantern);color:var(--lantern-ink)}
.sp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:600px){.sp-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sp-chip{position:relative;display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 40px 8px 10px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;user-select:none;background:color-mix(in srgb,var(--ink-3) 50%,transparent);transition:border-color .15s,background .15s}
.sp-chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.sp-chip input{position:absolute;opacity:0;pointer-events:none}
.sp-tick{position:absolute;right:12px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;border:1.5px solid var(--mute)}
.sp-chip:has(input:checked){border-color:var(--lantern);background:color-mix(in srgb,var(--lantern) 14%,transparent)}
.sp-chip:has(input:checked) .sp-tick{background:var(--lantern);border-color:var(--lantern)}
.sp-chip:has(input:checked) .sp-tick::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--lantern-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.sp-chip:not(:has(input:checked)) .avatar{opacity:.4}.sp-chip:not(:has(input:checked)) span{color:var(--mute)}
.sp-chip:has(input:focus-visible){outline:2px solid var(--lantern);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 3px;cursor:pointer;font-size:13px;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){border-color:var(--lantern);background:rgba(233,169,63,.12)}
.chip:not(:has(input:checked)) .avatar{opacity:.35}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink-3);color:var(--paper)}
.notice{font-size:13px;padding:10px 14px;border-radius:10px;background:rgba(229,138,168,.1);border:1px solid rgba(229,138,168,.3)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:99px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* Fond immersif + calendrier */
.backdrop{position:fixed;inset:0;z-index:0;background:var(--ink);background-size:cover;background-position:center;pointer-events:none}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 55%,transparent),color-mix(in srgb,var(--ink) 82%,transparent) 40%,color-mix(in srgb,var(--ink) 90%,transparent))}
main{position:relative;z-index:1}
.hero::after{background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 0%,transparent) 30%,color-mix(in srgb,var(--ink) 55%,transparent) 75%,color-mix(in srgb,var(--ink) 75%,transparent) 100%)}
.panel{background:color-mix(in srgb,var(--ink-2) 78%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.act{background:color-mix(in srgb,var(--ink) 55%,transparent)}
.cal{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px}
@media (max-width:860px){.cal{grid-template-columns:minmax(0,1fr)}}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.month h4{font-family:var(--display);margin:0 0 8px;font-size:16px;text-transform:capitalize}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{font-size:11px;color:var(--mute);text-align:center}
.day{aspect-ratio:1;max-width:100%;border:1px solid transparent;border-radius:9px;background:color-mix(in srgb,var(--paper) 5%,transparent);display:grid;place-items:center;position:relative;cursor:pointer;font-size:13px;padding:0}
.day:hover:not(:disabled){border-color:color-mix(in srgb,var(--paper) 35%,transparent)}
.day.out{visibility:hidden}
.day.in{background:color-mix(in srgb,var(--c) 26%,transparent);font-weight:700}
.day.in::after{content:"";position:absolute;left:22%;right:22%;bottom:4px;height:3px;border-radius:2px;background:var(--c)}
.day.sel{border-color:var(--paper);box-shadow:0 0 0 1px var(--paper)}
.day .dot{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--paper)}
.day:disabled{opacity:.35;cursor:default}
.legend{display:grid;gap:8px}
.leg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.leg>i,.swatch{width:12px;height:12px;border-radius:4px;display:inline-block;flex:0 0 auto}
.nights{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.nights input{width:58px!important;padding:5px 6px!important;text-align:center}
.stage[aria-pressed="true"]{border-color:var(--c,var(--lantern))}
.daygroup{display:grid;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);scroll-margin-top:80px}
.daygroup.sel{border-color:color-mix(in srgb,var(--paper) 50%,transparent);background:color-mix(in srgb,var(--paper) 4%,transparent)}
.dayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

:root{padding-top:0}
body{margin:0}
img{max-width:100%}
/* ---- Thème clair ---- */
html[data-theme="light"]{--ink:#EEF1F6;--ink-2:#FFFFFF;--ink-3:#E2E6EF;--line:rgba(26,31,51,.13);--paper:#182036;--mute:#5B6276;--lantern:#B8730F;--lantern-ink:#FFFFFF;--sakura:#C64F77;--good:#2E8B5E;--bad:#C2412D;--seg1:#4F7FD0;--seg2:#2E9B6B;--seg3:#D08A1E;color-scheme:light}
html[data-theme="light"] .join[aria-pressed="true"]{color:#fff}
html[data-theme="light"] .panel{box-shadow:0 1px 3px rgba(24,32,54,.06)}
.hero,.mapbox,#gate,#login,#viewer{--ink:#0E1220;--ink-2:#151a2c;--ink-3:#1d2339;--line:rgba(236,229,214,.11);--paper:#ECE5D6;--mute:#b0aa9e;--lantern:#E9A93F;--lantern-ink:#2a1c05;color:var(--paper)}
/* ---- Paramètres ---- */
.gearbtn{border:1px solid var(--line);background:none;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--paper);flex:0 0 auto}
.gearbtn svg{width:19px;height:19px}
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(5,7,14,.55);display:flex;justify-content:flex-end;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{width:min(460px,100%);height:100%;overflow-y:auto;background:var(--ink);border-left:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:18px;align-content:start}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h2{font-size:24px}
.set{display:grid;gap:10px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--ink-2)}
.set h3{font-size:16px;margin:0}
.small{font-size:13px;margin:0}
.seg.wide{display:flex}.seg.wide button{flex:1}
.set .iconpick{grid-template-columns:repeat(4,minmax(0,1fr))}
.set .iconpick img{width:48px;height:48px;border-radius:12px}

/* ---- Photos ---- */
.pgroup{display:grid;gap:8px}
.pgroup+.pgroup{margin-top:22px}
.psep{display:flex;align-items:center;gap:10px;margin:2px 0 4px}.psep span{font-family:var(--display);font-size:17px;font-weight:700;white-space:nowrap;display:inline-block}.psep span::first-letter{text-transform:uppercase}

.dayfilter{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none;margin-bottom:6px}.dayfilter::-webkit-scrollbar{display:none}
.dayfilter button{flex:0 0 auto;border:1px solid var(--line);background:var(--ink-3);color:var(--paper);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:38px}
.dayfilter button small{color:var(--mute);margin-left:4px}
.dayfilter button[aria-pressed="true"]{background:var(--lantern);border-color:var(--lantern);color:var(--lantern-ink)}.dayfilter button[aria-pressed="true"] small{color:inherit;opacity:.8}
.gauge{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--ink-3) 60%,transparent);margin-bottom:4px}
.gtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.gbar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--paper) 12%,transparent);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px;background:var(--lantern);transition:width .4s}
.gauge.warn .gbar i{background:#E0A030}.gauge.crit .gbar i{background:var(--bad)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.pgrid.selmode .ptile img{transition:transform .15s,opacity .15s}
.ptile.on img{transform:scale(.9);border-radius:8px}.ptile.on{background:color-mix(in srgb,var(--lantern) 30%,var(--ink-3))}
.pcheck{position:absolute;top:6px;left:6px;z-index:2;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3);box-shadow:0 1px 4px rgba(0,0,0,.4)}

.sb-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.sb-act{display:flex;gap:8px;flex-wrap:wrap}.sb-act .btn{flex:1 1 140px}

.vdl::before{content:"";position:absolute;inset:0;width:calc(var(--p,0)*1%);background:var(--lantern);opacity:.85;transition:width .2s}
.vdl span{position:relative;color:#fff;font-weight:600}
/* Loader « pétales en ronde » : rose en Sakura, or en Sombre et Clair */

  for(const k of ["done","joined","amounts"])if(k in d){if(!d[k]||typeof d[k]!=="object"||Array.isArray(d[k]))d[k]={};else for(const x of Object.keys(d[k]))if(!ID_RE.test(x))delete d[k][x]}
  for(const k of ["date","start","end","checkout"])if(k in d&&!(d[k]==null||(typeof d[k]==="string"&&DATE_RE.test(d[k]))))delete d[k];
  for(const k of ["url","resaUrl"])if(k in d)d[k]=safeUrl(d[k]);
  for(const k of ["price","amount","nights","order","rate","target","lat","lon","budget"])if(k in d&&d[k]!=null&&typeof d[k]!=="number"){const n=Number(d[k]);d[k]=Number.isFinite(n)?n:null}
  if("color" in d&&!(typeof d.color==="string"&&HEX_RE.test(d.color)))d.color="#E9A93F";
  for(const k of ["title","name","note","label","body","cat","area","cuisine","time","transport","currency","createdAt"])if(k in d&&d[k]!=null&&typeof d[k]!=="string")d[k]=String(d[k]);
  return d;
}

/* ----- Pétales de cerisier dans le bandeau du haut et la barre du bas (thème Sakura) ----- */
const Petals=(()=>{
  const sets=[];let raf=0,last=0;
  const reduce=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
  const active=()=>!!document.documentElement.getAttribute("data-theme");
  const mode=()=>document.documentElement.getAttribute("data-theme")||"sakura";
  function spawn(w,h,init){return{x:Math.random()*w,y:init?Math.random()*h:-8-Math.random()*20,s:3.5+Math.random()*4.5,vy:9+Math.random()*14,vx:-4+Math.random()*10,r:Math.random()*6.28,vr:(-1+Math.random()*2)*1.4,sw:Math.random()*6.28,a:.55+Math.random()*.4,l:84+Math.random()*9}}
  function size(st){const d=Math.min(2,window.devicePixelRatio||1),w=st.host.clientWidth,h=st.host.clientHeight;if(!w||!h)return false;
    if(st.c.width!==Math.round(w*d)||st.c.height!==Math.round(h*d)){st.c.width=Math.round(w*d);st.c.height=Math.round(h*d);st.w=w;st.h=h;st.d=d;
      const n=Math.round(Math.max(6,Math.min(42,(w*h)/2300)));st.k=Math.max(1,h/200);st.ps=Array.from({length:n},()=>spawn(w,h,true))}return true}
  function petal(ctx,p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.scale(1,.55+.45*Math.abs(Math.sin(p.sw)));const s=p.s;
    ctx.beginPath();ctx.moveTo(0,-s);ctx.bezierCurveTo(s*.95,-s*.7,s*.75,s*.75,0,s);ctx.bezierCurveTo(-s*.75,s*.75,-s*.95,-s*.7,0,-s);
    const m=mode(),gold=m!=="sakura";
    if(gold){const g=ctx.createLinearGradient(-s,-s,s,s);const L=m==="light"?p.l-36:p.l-28,A=Math.min(1,p.a+.15);g.addColorStop(0,`hsla(48,100%,${L+18}%,${A})`);g.addColorStop(.5,`hsla(42,95%,${L+4}%,${A})`);g.addColorStop(1,`hsla(36,90%,${L-8}%,${A})`);ctx.fillStyle=g}
    else ctx.fillStyle=`hsla(342,85%,${p.l}%,${p.a})`;
    ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-s*.55);ctx.lineTo(-s*.18,-s);ctx.lineTo(s*.18,-s);ctx.closePath();ctx.fillStyle=gold?(m==="light"?"rgba(255,255,255,.85)":"rgba(255,244,214,.85)"):"rgba(255,240,245,.9)";ctx.fill();
    ctx.restore()}
  function frame(ts){
    raf=0;if(!active()||document.visibilityState!=="visible"){sets.forEach(st=>{const x=st.c.getContext("2d");x.clearRect(0,0,st.c.width,st.c.height)});return}
    const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
    sets.forEach(st=>{if(!size(st))return;const ctx=st.c.getContext("2d");ctx.setTransform(st.d,0,0,st.d,0,0);ctx.clearRect(0,0,st.w,st.h);
      st.ps.forEach((p,i)=>{if(!reduce()){p.sw+=dt*1.6;p.y+=p.vy*dt*(st.k||1);p.x+=p.vx*dt+Math.sin(p.sw)*.35;p.r+=p.vr*dt;
        if(p.y>st.h+10||p.x<-12||p.x>st.w+12)st.ps[i]=spawn(st.w,st.h,false)}petal(ctx,st.ps[i])})});
    if(!reduce())raf=requestAnimationFrame(frame);
  }
  function kick(){if(!raf){last=0;raf=requestAnimationFrame(frame)}}
  function mount(host){if(!host||host.querySelector(":scope > canvas.petals"))return;const c=document.createElement("canvas");c.className="petals";c.setAttribute("aria-hidden","true");host.prepend(c);sets.push({host,c,ps:[],w:0,h:0,d:1})}
  document.addEventListener("visibilitychange",kick);window.addEventListener("resize",kick);
  return{init(){mount(document.querySelector(".topbar"));mount(document.querySelector("nav.tabs"));mount(document.getElementById("gate"));mount(document.getElementById("login"));kick()},update:kick};
})();

const amtEur = x => x==null||x==="" ? 0 : typeof x==="number" ? x : toEur(Number(x.v)||0, x.c);
const num2 = n => Math.round(n*100)/100;
function dual(base,val,attrs){
  let j="",e="";
  if(val!=null&&val!==""){
    if(typeof val==="number"){e=num2(val);j=Math.round(val*rate())}
    else if(val.c==="JPY"){j=Math.round(Number(val.v)||0);e=num2((Number(val.v)||0)/rate())}
    else {e=num2(Number(val.v)||0);j=Math.round((Number(val.v)||0)*rate())}
  }
  return `<div class="dual"><label><input type="number" min="0" step="any" id="${base}-JPY" data-base="${base}" data-cur="JPY" value="${j}" placeholder="0" ${attrs}><span>¥</span></label><label><input type="number" min="0" step="any" id="${base}-EUR" data-base="${base}" data-cur="EUR" value="${e}" placeholder="0" ${attrs}><span>€</span></label></div>`;
}
const DEFAULT_ALERTS=[50,75,90,100];
const alerts = () => (Array.isArray(S.trip.alerts)&&S.trip.alerts.length?S.trip.alerts:DEFAULT_ALERTS).map(Number).filter(n=>n>0).sort((a,b)=>a-b);
function personBudget(t){
  const fixed=S.budget.reduce((s,b)=>s+amtEur(b.amounts&&b.amounts[t.id]),0);
  const travel=stages().reduce((s,x)=>s+amtEur(x.transport),0);
  const all=S.activities.filter(a=>a.joined&&a.joined[t.id]&&!isInfo(a));const list=all.filter(a=>!isPlace(a)),rl=all.filter(isPlace);
  const acts=list.reduce((s,a)=>s+(Number(a.price)||0),0)/rate();
  const byKind={};Object.keys(PLACE_KINDS).forEach(k=>{const l=rl.filter(a=>a.kind===k);byKind[k]={sum:l.reduce((s,a)=>s+placeCost(a),0)/rate(),n:l.length}});
  const resto=Object.values(byKind).reduce((s,x)=>s+x.sum,0);
  const booked=list.filter(a=>a.booked).reduce((s,a)=>s+(Number(a.price)||0),0)/rate();
  const target=amtEur(t.target), total=fixed+travel+acts+resto;
  return {fixed,travel,acts,resto,byKind,rcount:rl.length,booked,total,target,count:list.length,pct:target?100*total/target:null};
}
function level(pct){
  if(pct==null) return null;
  const reached=alerts().filter(a=>pct>=a);
  if(!reached.length) return {lvl:"ok",step:null};
  const step=reached[reached.length-1];
  return {lvl:pct>=100?"crit":step>=75?"warn":"info",step};
}
function spentBy(t){
  return S.expenses.reduce((s,e)=>{if(e.kind==="settle")return s;const among=(e.among||[]).filter(id=>T(id));if(!among.includes(t.id))return s;return s+toEur(Number(e.amount)||0,e.currency)/among.length},0);
}
const bothCur = v => `${eur(v)} <span class="muted">· ${yen(v*rate())}</span>`;
function stackChart(b){
  const max=Math.max(b.target,b.total,1)*1.1, w=v=>(100*v/max).toFixed(2);
  const segs=[["Postes fixes",b.fixed,"var(--seg1)"],["Trajets",b.travel,"var(--seg2)"],["Activités",b.acts,"var(--seg3)"]].concat(Object.entries(PLACE_KINDS).map(([k,K])=>[K.label,(b.byKind&&b.byKind[k].sum)||0,K.color]));
  const ticks = b.target ? alerts().filter(a=>a<=110).map(a=>{const x=w(b.target*a/100);return `<span class="tick ${a===100?"full":""}" style="left:${x}%"><em style="${x>88?"transform:translateX(-100%)":x<6?"transform:none":""}">${a===100?"Prévisionnel":a+" %"}</em></span>`}).join("") : "";
  return `<div class="chart" role="img" aria-label="Budget prévu ${eur(b.total)} sur un prévisionnel de ${eur(b.target)}">
    <div class="track">${segs.map(([l,v,c])=>v>0?`<i style="width:${w(v)}%;background:${c}" title="${l} : ${eur(v)}"></i>`:"").join("")}${ticks}</div>
    <div class="axis"><span>0 €</span><span>${eur(max)}</span></div>
    <div class="keys">${segs.map(([l,v,c])=>`<span><i style="background:${c}"></i>${l} <b class="num">${eur(v)}</b></span>`).join("")}</div></div>`;
}
function alertBanner(b,who){
  const L=level(b.pct); if(!L||L.lvl==="ok") return "";

    : `${who} : palier de ${L.step} % atteint. ${p} % du budget prévisionnel est déjà prévu, il reste ${eur(reste)}.`;
  return `<div class="alert ${L.lvl}" role="status"><b>${L.lvl==="crit"?"Dépassement":"Alerte budget"}</b><span>${msg}</span></div>`;
}

/* ----- Dépenses partagées ----- */
function balances(){
  const bal={}; S.travelers.forEach(t=>bal[t.id]=0);
  S.expenses.forEach(e=>{const amt=toEur(Number(e.amount)||0,e.currency);const among=(e.among||[]).filter(id=>id in bal);if(!among.length||!(e.payer in bal))return;
    bal[e.payer]+=amt; among.forEach(id=>bal[id]-=amt/among.length)});
  return bal;
}
function settlements(bal){
  const cred=[],debt=[];Object.entries(bal).forEach(([id,v])=>{if(v>0.005)cred.push([id,v]);else if(v<-0.005)debt.push([id,-v])});
  cred.sort((a,b)=>b[1]-a[1]);debt.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){const m=Math.min(debt[i][1],cred[j][1]);out.push({from:debt[i][0],to:cred[j][0],amt:m});debt[i][1]-=m;cred[j][1]-=m;if(debt[i][1]<0.005)i++;if(cred[j][1]<0.005)j++}
  return out;
}

  if(k==="task"){const t=String(d.get("title")).trim();if(!t)return;open.task=false;f.reset();put("tasks",nid("t"),{title:t,cat:d.get("cat"),order:S.tasks.length+1,done:{},owner:solo?me.id:null,createdBy:me?me.id:null,createdAt:new Date().toISOString()});if(!solo)notifyGroup("prep",`${myName()} a ajouté une étape : ${t}`);toast(solo?"Étape ajoutée à ta liste":"Étape ajoutée pour tout le monde")}
  if(k==="place"){const t=String(d.get("title")).trim();if(!t)return;const p=d.get("price"),kind=String(d.get("kind"));if(!PLACE_KINDS[kind])return;placeOpen=null;f.reset();
    put("activities",nid("r"),{kind,title:t,stage:stageSel,cuisine:String(d.get("cuisine")||""),area:String(d.get("area")||"").trim(),price:p===""||p==null?null:Number(p),resaUrl:safeUrl(d.get("resaUrl")),url:safeUrl(d.get("url")),date:d.get("date")||null,checkout:d.get("checkout")||null,time:"",note:String(d.get("note")||"").trim(),booked:false,joined:me?{[me.id]:true}:{},order:S.activities.filter(x=>x.stage===stageSel&&x.kind===kind).length+1,createdBy:me?me.id:null,createdAt:new Date().toISOString()});
    notifyGroup("plan",`${myName()} a ajouté ${kind==="hotel"?"un hébergement":kind==="shop"?"une adresse shopping":kind==="bar"?"une sortie":"un restaurant"} à ${(stages().find(x=>x.id===stageSel)||{}).name||""} : ${t}`);
    toast(PLACE_KINDS[kind].one.charAt(0).toUpperCase()+PLACE_KINDS[kind].one.slice(1)+" ajouté");return}
  if(k==="info"){const t=String(d.get("title")).trim();if(!t)return;const data={title:t,cat:String(d.get("cat")),body:String(d.get("body")||"").trim(),url:safeUrl(d.get("url"))};const id=d.get("id");
    infoOpen=false;infoEdit=null;infoPrefill=null;
    if(id){patch("activities",String(id),data);toast("Fiche mise à jour")}else{put("activities",nid("i"),{kind:"info",...data,stage:null,owner:solo?me.id:null,order:S.activities.filter(isInfo).length+1,createdBy:me?me.id:null,createdAt:new Date().toISOString()});if(!solo)notifyGroup("prep",`${myName()} a ajouté une fiche pratique : ${t}`);toast(solo?"Fiche ajoutée, visible par toi seul":"Fiche ajoutée pour tout le monde")}return}
  if(k==="act"){const t=String(d.get("title")).trim();if(!t)return;const p=d.get("price");f.reset();put("activities",nid("a"),{title:t,stage:stageSel,price:p===""?null:Number(p),note:String(d.get("note")||"").trim(),url:safeUrl(d.get("url")),date:d.get("date")||null,booked:false,joined:me?{[me.id]:true}:{},order:S.activities.filter(x=>x.stage===stageSel).length+1,createdBy:me?me.id:null,createdAt:new Date().toISOString()});notifyGroup("plan",`${myName()} a ajouté une activité à ${(stages().find(x=>x.id===stageSel)||{}).name||""} : ${t}`);open.act=false;f.reset();toast(POI[t]?"Activité ajoutée, visible sur la carte":"Activité ajoutée. Utilise « Placer sur la carte » pour la situer")}
  if(k==="line"){const l=String(d.get("label")).trim();if(!l)return;put("budget",nid("b"),{label:l,order:S.budget.length+1,amounts:{},createdBy:me?me.id:null,createdAt:new Date().toISOString()});notifyGroup("budget",`${myName()} a ajouté un poste au budget : ${l}`);open.line=false;f.reset();toast("Poste ajouté")}
  if(k==="exp"){const among=d.getAll("among");const amt=Number(d.get("amount"));if(!amt||!among.length){toast("Indique un montant et au moins une personne");return}
    f.reset();put("expenses",nid("e"),{title:String(d.get("title")).trim(),amount:amt,currency:expCur,payer:d.get("payer"),among,date:d.get("date")||"",createdBy:me?me.id:null,createdAt:new Date().toISOString()});
    notifyGroup("split",`${myName()} a ajouté une dépense : ${String(d.get("title")).trim()} (${expCur==="JPY"?yen(amt):eur2(amt)}${among.length<S.travelers.length?`, partagée entre ${among.length}`:""})`);f.reset();
    f.querySelectorAll('[name="among"]').forEach(c=>c.checked=true);if(me)f.payer.value=me.id;toast("Dépense enregistrée")}
});

boot();
Petals.init();
})();
</script>
<script>
if("serviceWorker" in navigator){
  const hadController=!!navigator.serviceWorker.controller;
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    const check=()=>reg.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check()});
    setInterval(check,15*60*1000);
  }).catch(()=>{}));
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(window.__pullReload){try{sessionStorage.setItem("japon-tab",window.__tab||"")}catch(e){}location.reload();return}if(hadController){const b=document.getElementById("updateBar");if(b)b.hidden=false}});
}
</script>
